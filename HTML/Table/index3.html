<!-- 10.3  A well-structured table: thead, tbody, tfoot -->

<table border="1" cellpadding="6" cellspacing="0" height="40%" width="90%" bgcolor="orange">
    <thead>
        <tr>
            <th >Item</th>
            <th>Qty</th>
            <th>Price</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td align="right">Notebook</td>
            <td >3</td>
            <td>150</td>
        </tr>
        <tr>
            <td>Pen</td>
            <td>5</td>
            <td>50</td>
        </tr>
    </tbody>

    <tfoot>
         <tr><td colspan="2">Total</td><td>200</td></tr>
    </tfoot>

</table>
