<!DOCTYPE html>

<head>

    <meta name="description" content="Contact information for The Little Taco Shop">

<body>
    <header>
        <h1>Contact Us</h1>

        <nav>
            <ul>
                <li><a href="/Html Project/Home.html">Home</a></li>
                <li><a href="/Html Project/Home.html#about">About <abbr title="The Little Taco Shop">LTS</abbr></a>
                </li>
                <li><a href="/Html Project/Home.html#Menu">Our Menu</a></li>
                <li><a href="hours.html">Store Hours</a></li>
            </ul>
        </nav>

        <figure>
            <img src="Image/tacos_close_up_400x260.png " alt="Little taco Shop Tacos"
            title="Tacos ready to eat!" width="400px" height="267">

            <figcaption>Little Taco Shop Tacos</figcaption>
        </figure>
    </header>

    <hr>

    <main>
        <!-- Our Content -->
         <h2>Our Contact Form</h2>

         <section>
            
         <form action="https://httpbin.org/get" method="get">

            <fieldset>
                <legend>Send Us a Message</legend>
                <p>
                    <label for="name">Name:</label>
                    <input type="text" name="name" id="name"
                    placeholder="Your name required">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="text" email="email" id="email"
                    placeholder="Your email required">
                </p>

                <p>
                    <label for="message">Your message:</label>
                    <br>
                      <textarea name="message" id="message" cols="30" rows="10" 
                     placeholder="Type your message here"></textarea>
                </p>
              
            </fieldset>

            <button type="submit">Send</button>
             <button type="reset">Reset</button>
         </form>
         </section>

         <section>
            <h2>Our Location</h2>
            <address>
                555 taco temptation lane, suite t
                <br>
                kansas city,mo. 555555-5555
                <br><br>
                Phone :<a href="tel: +55555555555">
                    5555-555-5555
                </a>
            </address>
         </section>
    </main>

    <hr>

    <footer>
        <p>Copyright &copy; The Little Taco Shop.</p>
    </footer>
</body>
