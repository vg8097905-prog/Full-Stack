<!-- Chap-6.Attributes: Giving Tags Extra Power -->

<!-- 6.1:Attributes changing the same tag -->


<p>A normal paragraph with no attributes.</p>

<p style="color:blue">Blue text using inline CSS.</p>

<p style="color:white; background-color:green;
padding:8px">White on green box.</p>

<p style="text-align:center">This text is centred.</p>

<p style="font-size:22px; font-family:Verdana">Bigger font</p>

<p title="I am a tooltip">Hover the mouse over me.</p>

<p hidden>You will never see this line.</p>

<p id="last" class="highlight">I have an id and a class.</p>
