<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <H1>Job Application</H1>
        <br>
        <label for="1">Name:</label>
        <br>
        <input type="text" name=" name" id="1">
        <br><br>

        <label for="2">Email:</label>
        <br>
        <input type="email" name="email" id="2">
        <br><br>

        <label for="3">Phone:</label>
        <br>
        <input type="tel" name="Phone" id="3">
        <br><br>

        <label for="4">Resume:</label>
        <br>
        <input type="file" name="resume" id="4">
        <br><br>
        <label for="counter">Experience(in years):</label>
        <input type="number" name="counter" id="counter" min="0" max="50">
        <br><br>

        <fieldset>
            <legend>Skills</legend>
       
        <input type="checkbox" id="5">
        <br>
         <label for="5">HTML</label>
        <br>
        
        <input type="checkbox" id="6">
        <br>
        <label for="6">CSS</label>
        <br>
        
        <input type="checkbox" id="7">
        <br>
        <label for="7">Java Script</label>
        <br>
        </fieldset>
        <br>

        <label for="8">Highest Education:</label>
        <select name="qualification" id="8">
            <option value="High School">High School</option>
            <option value="Inter">Inter</option>
            <option value="Graduation">Graduation</option>
        </select>
        <br><br>
          
        <fieldset>
            <legend>Availability:</legend>
        
        <input type="radio" name="radio" id="9" value="Full-time">
        <br>
        <label for="9">Full-time</label>
        <br>
        
        <input type="radio" name="radio" id="10" valve="Part-time">
        <br>
        <label for="10">Part-time</label>
        <br>
        </fieldset>
        <br>
        
        <label for="11">Additional Comments:</label>
        <br>
        <textarea name="textarea" id="11" cols="30" rows="5"></textarea>
        <br>

        <input type="button" value="Submit Application">
    </form>
</body>
</html>
