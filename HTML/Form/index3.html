<!--11.4  The HTML5 input types  -->

 <p>Email:  <input type="email" name="mail" required></p>
 <p>Number: <input type="number" name="age" min="18" max="60"></p>
 <p>Date:   <input type="date" name="dob"></p>
 <p>Time:   <input type="time" name="slot"></p>
 <p>Colour: <input type="color" name="fav" value="#e11d48"></p>
 <p>Range:  <input type="range" name="vol" min="0" max="100"></p>
 <p>File:   <input type="file" name="photo"></p>
 <p>Phone:  <input type="tel" name="mob" maxlength="10"></p>
 <p>Search: <input type="search" name="q" placeholder="Search..."></p>
  <p>Website:<input type="url" name="site"></p>
  <input type="hidden" name="formid" value="99">
