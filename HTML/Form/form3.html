<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>

        <h1>Complex Form</h1>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="1">Name</label>
            <input type="text" id="1">

            <label for="2">Email</label>
            <input type="email" id="2">

            <label for="3">Phone</label>
            <input type="tel" id="3">

            <label for="4">Date of Birth</label>
            <input type="date" id="4">

            <span>Gender</span>
            <input type="radio" id="5" name="gender">
            <label for="5">Male</label>

            <input type="radio" id="6" name="gender">
            <label for="6">female</label>
        

            <label for="7">Country</label>
            <select name="country" id="7">
                <option value="United States">United States</option>
            </select>

        </fieldset>

        <fieldset>
            <legend>
                <label for="8">Address Street</label>
                <input type="text" id="8">

                <label for="9">City</label>
                <input type="text" id="9">

                <label for="10">State</label>
                <input type="text" id="10">

                <label for="11">Zip Code</label>
                <input type="text" id="11">
            </legend>
        </fieldset>

        <fieldset>
            <legend>Other Informations</legend>

            <label for="12">Comments</label>
            <textarea name="comments" id="12"></textarea>

            <label for="13">I agree to the terms of service</label>
            <input type="checkbox" name="policy" id="13">
        </fieldset>
        
        <input type="button" value="Submit">
    </form>
</body>
</html>
