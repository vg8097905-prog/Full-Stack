<!-- 11.6  Textarea, buttons, fieldset and legend -->

<!-- The complete registration form -->

<form action="register.php" method="post">                           
    <fieldset>
        <legend>Student Registration</legend>

        <p><label>Full Name:
            <input type="text" name="fname" placeholder="Enter your name"
            required autofocus></label>
        </p>

        <p><label>Roll No:
            <input type="text" name="roll" value="B2026" readonly></label>
        </p>

        <p><label>Address:<br>
            <textarea name="addr" rows="3" cols="30"
                placeholder="House no, street, city">
            </textarea></label>
        </p>

        <p><input type="checkbox" name="agree" required>
            I accept the terms and conditions
        </p>

        <p><button type="submit">Register Now</button>
            <button type="reset">Reset</button>
        </p>
    </fieldset>
</form>
