<!--Chap-1&2. 1. Your very first web page -->
<!DOCTYPE html>
<html>
<head>
    <title>My First Page</title>
</head>
<body>
    <h1>Welcome to Web Technology</h1>
    <p>This is my first web page.</p>

    <!--2. Nesting: boxes inside boxes -->
    <p>Plain sentence.</p>

    <p>A <b>bold</b> word inside a paragraph.</p>

    <p><b><i>Bold and italic together</i></b></p>

    <!-- This is a comment. The browser ignores it. -->
    <p>Comments do not appear in output.</p>


    <!--3. A surprise: HTML ignores your extra spaces and enter-keys -->
    <p>Hello students</p>
    
    <p>I pressed
    Enter three times
    inside this paragraph</p>
    
    <p>Use a tag to break the line:<br>Now it breaks!</p>

</body>
</html>
