<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation in CSS</title>
    <!-- changing from one style to another style(red to green) -->
     <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            /* resit overflow of box */
        }
        .container  {
            width: 100vw;
            height: 800px;
            background-color: beige;
            border: 5px solid black;
        }
        .box{
            width:350px;
            height: 80px;
            background-color: blue;
            border: 4px solid black;
            margin: 10px;
            border-radius: 10px;
            position: relative;
            /* animation-name: rightMovement;
            animation-duration: 5s;
            animation-iteration-count: 1;
            animation-delay: 2s;
            animation-timing-function: linear; */
            /* animation-timing-function: ease-in; */
            /* animation-timing-function: ease-out; */
            /* animation-timing-function: cubic-bezier(1, -0.4,1,1); */

            /* animation-direction: alternate; */
            /* animation-direction: reverse; */
            /* animation-direction:alternate-reverse; */

            /* animation-fill-mode: forwards; */
            /* animation-fill-mode:backwards; */
            /* default position */

            /* @keyframes duration|easing-function|delay|iteration-count|direction|
            fill-mode|play-state|name (shorthand notation)*/
                        animation: 5s linear 1s infinite alternate none running rightMovement;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

        }

        @keyframes rightMovement{
            from{
                top: 0;
                left: 0;
            }

            to{
                top: 0;
                left: 1800px;
            }
        }
        #box2{
             width:350px;
            height: 80px;
            background-color: blue;
            border: 4px solid black;
            margin: 10px;
            border-radius: 10px;
            position: relative;
            animation: 5s linear 1s infinite alternate none running leftMovement;

        }
          @keyframes leftMovement{
            from{
                top: 800px;
                left: 1800px;
            }

            to{
                top: 800px;
                left: 0px;
            }
        }

        #circle{
              width:200px;
            height: 200px;
            background-color: blue;
            border: 4px solid black;
            margin: 10px;
            border-radius: 100px;
            position: relative;
            top: 30%;
            left: 40%;
                animation: 5s ease-in-out 0s infinite alternate-reverse none running circleMovement;
        }

         @keyframes circleMovement{
            0%{
                top: 1%;
                left:5%;
            }

        

            30%{
                top:5%;
                left:90%;
            }

            
            60%{
                top: 70;
                left: 10%
            }
            

            100%{
                top:95%;
                left:90%;
            } 
        } 

     </style>
</head>
<body>
      <div class="container">
        <div class="box">
        </div>

          <div id="box2">
      </div>
      <div id="circle"></div>
      </div>

</body>
</html>
